name: Test Hostinger web application
on:
  push:
    branches: [main, web/hostinger]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: pharmacy_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: test-only-password
      DB_NAME: pharmacy_test
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Node and MySQL tests
        shell: bash
        run: |
          mkdir -p web/test-output
          npm test 2>&1 | tee web/test-output/node-tests.txt
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config web/playwright.config.js
      - name: Retain web test screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pharmacy-Web-test-evidence
          path: web/test-output/
