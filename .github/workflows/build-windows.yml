name: Build and release Windows installer
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a new version after all checks pass (requires an unused release tag)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main, ui/modern-dispensary]
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install installer compiler
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Test and build standalone Windows installer
        shell: powershell
        run: ./packaging/build-windows.ps1
      - name: Native interface interactions and screenshots
        shell: powershell
        env:
          PYTHONPATH: .
        run: ./.venv/Scripts/python.exe packaging/capture_ui.py build/screenshots
      - name: Test installed application and uninstaller
        shell: powershell
        run: ./packaging/test-installer.ps1
      - name: Assemble release packages and checksums
        shell: powershell
        run: ./packaging/package-release.ps1
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PharmacyDesktop-Windows-build-evidence
          path: |
            build/*smoke.json
            build/test-results.txt
            build/build-provenance.json
            build/screenshots/*
            release/*
          if-no-files-found: warn
      - name: Publish v0.2.0 release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.venv/Scripts/python.exe packaging/publish_release.py
